services:
  postgres:
    image: postgres:16-alpine
    container_name: requests-postgres
    environment:
      POSTGRES_DB: requests_db
      POSTGRES_USER: requests_user
      POSTGRES_PASSWORD: requests_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requests_user -d requests_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: requests-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/requests_db
      SPRING_DATASOURCE_USERNAME: requests_user
      SPRING_DATASOURCE_PASSWORD: requests_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/requests
    container_name: requests-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
